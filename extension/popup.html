<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body { width: 300px; padding: 15px; font-family: sans-serif; background: #f8fafc; }
        h3 { color: #0a66c2; margin-top: 0; text-align: center; }
        input { width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #cbd5e1; border-radius: 5px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; margin-bottom: 10px; cursor: pointer; font-weight: bold; border: none; border-radius: 5px; }

        #loginBtn        { background: #0a66c2; color: white; }
        #syncCookiesBtn  { background: #0a66c2; color: white; }
        #startCampaignBtn{ background: #16a34a; color: white; }
        #autoScanBtn     { background: #7c3aed; color: white; }
        #autoScanBtn.active { background: #dc2626; }
        #logoutBtn       { background: #ef4444; color: white; margin-top: 5px; }

        .hidden { display: none; }

        .mode-divider {
            font-size: 10px;
            color: #94a3b8;
            text-align: center;
            margin: 4px 0 8px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .btn-hint {
            font-size: 10px;
            color: #64748b;
            text-align: center;
            margin: -6px 0 8px;
            line-height: 1.3;
        }
    </style>
</head>
<body>
    <h3>Just Nabble It!</h3>
    <div id="status" style="font-size: 13px; text-align: center; font-weight: bold; margin-bottom: 10px;"></div>

    <div id="loginSection">
        <input type="email" id="extEmail" placeholder="Nabble Account Email">
        <input type="password" id="extPass" placeholder="Nabble Password">
        <button id="loginBtn">Login to Extension</button>
    </div>

    <div id="actionSection" class="hidden">
        <button id="startCampaignBtn">🚀 Start Campaign</button>
        <p class="btn-hint">Applies to jobs visible on your current LinkedIn search page.</p>

        <button id="autoScanBtn">🔍 Start Auto Scan</button>
        <p class="btn-hint" id="autoScanHint">Scans LinkedIn every 5 mins for new jobs matching your profile and applies automatically.</p>

        <button id="logoutBtn">🚪 Logout</button>
    </div>

    <script src="popup.js"></script>
</body>
</html>
